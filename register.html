<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | TravelX</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-brand">

        <div class="logo">
            Travel<span>X</span>
        </div>

        <h1>Start Your Journey</h1>

        <p>
            Tell us about your travel preferences and
            TravelX will personalize your recommendations.
        </p>

    </div>


    <div class="auth-card register-card">

        <h2>Create Account</h2>

        <p class="form-subtitle">
            Register as a TravelX user
        </p>

        <form id="registerForm">

            <div class="form-grid">

                <div>
                    <label>Name *</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Full name"
                        required
                    >
                </div>


                <div>
                    <label>Phone</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Phone number"
                    >
                </div>

            </div>


            <label>Email *</label>

            <input
                type="email"
                id="email"
                placeholder="Email address"
                required
            >


            <label>Password *</label>

            <input
                type="password"
                id="password"
                placeholder="Create password"
                required
            >


            <div class="form-grid">

                <div>

                    <label>Preferred Destination</label>

                    <input
                        type="text"
                        id="preferredDestination"
                        placeholder="e.g. Goa"
                    >

                </div>


                <div>

                    <label>Trip Duration</label>

                    <input
                        type="number"
                        id="tripDuration"
                        value="3"
                        min="1"
                    >

                </div>

            </div>


            <label>Travel Budget (₹)</label>

            <input
                type="number"
                id="budget"
                placeholder="e.g. 25000"
                min="0"
            >


            <label>Interests</label>

            <input
                type="text"
                id="interests"
                placeholder="Beach, Adventure, Food, Nature"
            >

            <small>
                Separate multiple interests with commas.
            </small>


            <button type="submit" class="primary-btn full-btn">
                Create Account
            </button>

        </form>


        <div id="message"></div>


        <p class="auth-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
